<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taka動作を移植したキャラクター</title>
<style>body{margin:0;overflow:hidden;font:14px system-ui;background:#dfe9f1}canvas{display:block}#panel{position:absolute;top:12px;left:12px;background:#fffffff0;padding:14px;border-radius:12px;width:310px;max-height:80vh;overflow:auto}button{padding:8px;margin:3px}#status{white-space:pre-wrap}#hide{position:absolute;right:12px;top:12px}small{line-height:1.6;display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<button id="hide">パネルを隠す</button><div id="panel"><b>Takaの実動作を移植</b><p>WASD：移動／Shift：走る／Space：ジャンプ<br>マウス：回転／ホイール：ズーム</p>
<div id="buttons"></div><button id="pause">一時停止</button><button id="front">正面</button><button id="side">横</button><button id="back">背面</button><p>動作の位置 <input id="seek" type="range" min="0" max="1" step="0.001" value="0"></p>
<button id="record">歩く→走る→跳ぶを録画</button><a href="character.glb" download="my-character-taka-motion.glb">動作付きGLBを保存</a><p id="status">読み込み中</p><small>簡易周期動作への置換は行いません。体型に応じて関節の変形や足滑りが残る場合があります。</small></div>
<script type="module">
import {loadGeneratedCharacter} from './motionstudio-adapter.js';
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#dfe9f1');const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.append(renderer.domElement);renderer.domElement.tabIndex=0;
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,200);camera.position.set(5.2,3.2,6.5);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.6,0);controls.update();scene.add(new THREE.HemisphereLight(0xffffff,0x888888,3));const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshBasicMaterial({color:0xa5b79c}));floor.rotation.x=-Math.PI/2;floor.position.y=-.003;scene.add(floor,new THREE.GridHelper(60,60,0x83967b,0x94a68b));
const actor=new THREE.Group();scene.add(actor);let mixer,model,actions,info,active='',paused=false,jumping=false,recording=false,keyboardControlled=false;const keys=new Set(),status=document.querySelector('#status'),seek=document.querySelector('#seek');const names={idle:'Idle_preview',walk:'Walk_preview',jog:'Jog_preview',run:'Run_preview',jump:'Jump_preview'},labels={idle:'待機',walk:'歩く',jog:'軽く走る',run:'走る',jump:'ジャンプ'};
function setPaused(value){paused=value;document.querySelector('#pause').textContent=paused?'再生':'一時停止';}
function play(mode){if(!actions?.[mode])return;if(active===mode)return;for(const a of Object.values(actions))a.stop();const a=actions[mode];a.reset().setEffectiveTimeScale(info?.modes?.[mode]?.game_rate||1).setLoop(mode==='jump'?THREE.LoopOnce:THREE.LoopRepeat,mode==='jump'?1:Infinity);a.clampWhenFinished=mode==='jump';a.play();active=mode;jumping=mode==='jump';status.dataset.action=mode;}
function angle(theta){camera.position.set(actor.position.x+7*Math.sin(theta),3.2,actor.position.z+7*Math.cos(theta));controls.target.set(actor.position.x,1.6,actor.position.z);controls.update();}
document.querySelector('#front').onclick=()=>angle(0);document.querySelector('#side').onclick=()=>angle(Math.PI/2);document.querySelector('#back').onclick=()=>angle(Math.PI);document.querySelector('#hide').onclick=()=>{const p=document.querySelector('#panel');p.hidden=!p.hidden;document.querySelector('#hide').textContent=p.hidden?'パネルを表示':'パネルを隠す';};document.querySelector('#pause').onclick=()=>{setPaused(!paused);};seek.oninput=()=>{if(!actions)return;setPaused(true);actions[active].time=Number(seek.value)*actions[active].getClip().duration;mixer.update(0);};
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.code==='Space')e.preventDefault();keys.add(e.code);if(['KeyW','KeyA','KeyS','KeyD'].includes(e.code))keyboardControlled=true;if(e.code==='Space'&&!jumping){play('jump');setPaused(false);}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>keys.clear());
document.querySelector('#record').onclick=async()=>{
 if(!mixer||recording)return;
 const button=document.querySelector('#record');let stream;
 try{
  if(typeof MediaRecorder==='undefined'||!renderer.domElement.captureStream)throw Error('録画はcanvas.captureStream対応のChromeなどで実行してください。');
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].find(x=>MediaRecorder.isTypeSupported(x));
  if(!mime)throw Error('このブラウザーでは対応する録画形式がありません。Chromeで実行してください。');
  recording=true;button.disabled=true;button.textContent='録画中…';setPaused(false);
  actor.position.set(0,0,0);actor.rotation.y=0;angle(.55);
  stream=renderer.domElement.captureStream(30);
  const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:8000000}),chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=()=>{
   for(const track of stream.getTracks())track.stop();
   const type=recorder.mimeType||mime;
   const url=URL.createObjectURL(new Blob(chunks,{type})),a=document.createElement('a');
   a.href=url;a.download='walk-run-jump.'+(type.includes('mp4')?'mp4':'webm');
   document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
   recording=false;button.disabled=false;button.textContent='歩く→走る→跳ぶを録画';
  };
  recorder.start();
  for(const mode of ['walk','run','jump']){active='';play(mode);await new Promise(r=>setTimeout(r,mode==='jump'?1600:3000));}
  recorder.stop();active='';play('idle');
 }catch(error){
  stream?.getTracks().forEach(track=>track.stop());recording=false;button.disabled=false;
  button.textContent='歩く→走る→跳ぶを録画';status.textContent='録画: '+error.message;
 }
};
async function boot(){const loaded=await loadGeneratedCharacter({THREE,GLTFLoader,baseURL:'./'});info=loaded.info;const gltf={scene:loaded.model,animations:loaded.clips};model=gltf.scene;actor.add(model);mixer=loaded.mixer;actions=loaded.actions;for(const [mode,name]of Object.entries(names)){const clip=gltf.animations.find(c=>c.name===name);if(!clip)throw Error('Taka動作がありません: '+name);actions[mode]=mixer.clipAction(clip);const b=document.createElement('button');b.textContent=labels[mode];b.onclick=()=>{active='';play(mode);setPaused(false);};document.querySelector('#buttons').append(b);}play('idle');mixer.addEventListener('finished',()=>{jumping=false;play('idle');});status.textContent='Takaの5動作を読み込みました。全体振幅 1.0\n'+(info.validation_passed?'':'関節変形の警告が残る場合があります。各方向から確認してください。');status.dataset.ready='true';}
let last=performance.now();function tick(now){requestAnimationFrame(tick);const dt=Math.min(.05,(now-last)/1000);last=now;if(mixer&&!paused){const x=Number(keys.has('KeyD'))-Number(keys.has('KeyA')),z=Number(keys.has('KeyS'))-Number(keys.has('KeyW'));if((x||z)&&!recording){const mode=keys.has('ShiftLeft')||keys.has('ShiftRight')?'run':'walk';if(!jumping)play(mode);const speed=info.modes[mode].suggested_speed,rate=info.modes[mode].game_rate||1;actions[mode].setEffectiveTimeScale(rate);const d=new THREE.Vector3(x,0,z).normalize().multiplyScalar(dt*speed*rate);actor.position.add(d);camera.position.add(d);controls.target.add(d);actor.rotation.y=Math.atan2(x,z);}else if(keyboardControlled&&!jumping&&!recording){play('idle');keyboardControlled=false;}mixer.update(dt);seek.value=actions[active].time/actions[active].getClip().duration;}controls.update();renderer.render(scene,camera);}requestAnimationFrame(tick);boot().catch(e=>{status.textContent='停止: '+e.message;status.dataset.error=e.message;console.error(e);});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></html>
